name: Move GIFs to images/exercises

on:
  workflow_dispatch:

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Move GIFs
        run: |
          mkdir -p images/exercises
          # Déplacer tous les GIFs de la racine vers images/exercises/
          find . -maxdepth 1 -name "*.gif" -exec mv {} images/exercises/ \;
          find . -maxdepth 1 -name "*.jpg" -exec mv {} images/exercises/ \;
          echo "GIFs moved:"
          ls images/exercises/ | wc -l

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add images/exercises/
          git add -u
          git diff --staged --quiet || git commit -m "Move GIFs to images/exercises"
          git pull --rebase origin main
          git push
