name: Download Exercise GIFs

on:
  workflow_dispatch: # Déclenchement manuel uniquement

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download GIFs from ExerciseDB
        run: |
          mkdir -p images/exercises
          node << 'EOF'
          const https = require('https');
          const fs = require('fs');
          const path = require('path');

          const API_KEY = '3e24d81530mshcafeab04111d0edp18126bjsn5a1f916e200f';
          
          async function fetchJSON(url) {
            return new Promise((resolve, reject) => {
              const options = {
                headers: {
                  'X-RapidAPI-Key': API_KEY,
                  'X-RapidAPI-Host': 'exercisedb.p.rapidapi.com'
                }
              };
              https.get(url, options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(JSON.parse(data)));
              }).on('error', reject);
            });
          }

          async function downloadGIF(id) {
            const dest = path.join('images/exercises', id + '.gif');
            if (fs.existsSync(dest)) return;
            const url = `https://exercisedb.p.rapidapi.com/image?exerciseId=${id}&resolution=180&rapidapi-key=${API_KEY}`;
            return new Promise((resolve) => {
              const options = {
                headers: {
                  'X-RapidAPI-Key': API_KEY,
                  'X-RapidAPI-Host': 'exercisedb.p.rapidapi.com'
                }
              };
              https.get(url, options, (res) => {
                if (res.statusCode !== 200) { resolve(); return; }
                const file = fs.createWriteStream(dest);
                res.pipe(file);
                file.on('finish', () => { file.close(); resolve(); });
              }).on('error', resolve);
            });
          }

          async function main() {
            let all = [];
            let offset = 0;
            while (true) {
              const page = await fetchJSON(`https://exercisedb.p.rapidapi.com/exercises?limit=10&offset=${offset}`);
              if (!page || !page.length) break;
              all = all.concat(page);
              offset += 10;
              console.log('Fetched:', all.length);
              if (page.length < 10) break;
            }
            console.log('Total exercises:', all.length);
            for (const ex of all) {
              await downloadGIF(ex.id);
              console.log('Downloaded:', ex.id);
            }
            console.log('Done!');
          }
          main().catch(console.error);
          EOF

      - name: Commit GIFs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add images/exercises/
          git commit -m "Add exercise GIFs" || echo "Nothing to commit"
          git push
