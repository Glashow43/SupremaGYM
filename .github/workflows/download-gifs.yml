name: Download Exercise GIFs

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download exercise data and GIFs
        run: |
          mkdir -p images/exercises
          
          # Télécharger la liste des exercices depuis free-exercise-db
          curl -L "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json" -o exercises.json
          
          # Extraire les IDs et télécharger les images
          node << 'EOF'
          const fs = require('fs');
          const https = require('https');
          const path = require('path');

          const exercises = JSON.parse(fs.readFileSync('exercises.json', 'utf8'));
          console.log('Total exercises:', exercises.length);

          function download(url, dest) {
            return new Promise((resolve) => {
              if (fs.existsSync(dest)) { resolve(); return; }
              const file = fs.createWriteStream(dest);
              https.get(url, (res) => {
                if (res.statusCode !== 200) { file.close(); fs.unlinkSync(dest); resolve(); return; }
                res.pipe(file);
                file.on('finish', () => { file.close(); resolve(); });
              }).on('error', () => { resolve(); });
            });
          }

          async function main() {
            for (const ex of exercises) {
              const id = ex.id;
              const dest = path.join('images/exercises', id + '.gif');
              const url = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/' + id + '/0.gif';
              await download(url, dest);
              // Essayer aussi en .jpg si pas de gif
              if (!fs.existsSync(dest) || fs.statSync(dest).size === 0) {
                const destJpg = path.join('images/exercises', id + '.jpg');
                const urlJpg = 'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/' + id + '/0.jpg';
                await download(urlJpg, destJpg);
              }
              console.log('Done:', id);
            }
            console.log('All done!');
          }
          main().catch(console.error);
          EOF

      - name: Commit images
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add images/exercises/
          git diff --staged --quiet || git commit -m "Add exercise images"
          git push
